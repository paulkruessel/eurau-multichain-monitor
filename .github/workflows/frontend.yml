name: Compile and test the frontend

on:
    push:
        branches:
            - main
        paths:
            - "eurau-client/**"
    pull_request:
        branches:
            - main
        paths:
            - "eurau-client/**"
            - ".github/workflows/frontend.yml"

jobs:
    checkout:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

    install-npm:
        runs-on: ubuntu-latest
        needs: checkout
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.16.0'
                  cache: 'npm'
                  cache-dependency-path: eurau-client/package-lock.json

    install-dependencies:
        runs-on: ubuntu-latest
        needs: install-npm
        defaults:
            run:
                working-directory: eurau-client
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.16.0'
                  cache: 'npm'
                  cache-dependency-path: eurau-client/package-lock.json

            - name: Install dependencies
              run: npm ci

    build:
        runs-on: ubuntu-latest
        needs: install-dependencies
        defaults:
            run:
                working-directory: eurau-client
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.16.0'
                  cache: 'npm'
                  cache-dependency-path: eurau-client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run ng build

    test:
        runs-on: ubuntu-latest
        needs: build
        defaults:
            run:
                working-directory: eurau-client
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.16.0'
                  cache: 'npm'
                  cache-dependency-path: eurau-client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test